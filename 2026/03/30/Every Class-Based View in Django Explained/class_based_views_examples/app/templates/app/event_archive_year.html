<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{ year }}</h1>
    {% for event in object_list %}
        <h1>{{ event.name }}</h1>
        <h2>{{ event.event_date }}</h2>
    {% endfor %}

    {% for month in date_list %}
        <h3>{{ month|date:"F" }}</h3>
    {% endfor %}

    <h2>Previous Year: {{ previous_year }}</h2>
    <h2>Next Year: {{ next_year }}</h2>
</body>
</html>
