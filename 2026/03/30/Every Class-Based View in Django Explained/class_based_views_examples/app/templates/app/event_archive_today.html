<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{ day|date:"j" }}</h1>
    {% for event in object_list %}
        <h1>{{ event.name }}</h1>
        <h2>{{ event.event_date }}</h2>
    {% endfor %}

    <h2>Previous Month: {{ previous_month }}</h2>
    <h2>Next Month: {{ next_month }}</h2>
    <h2>Previous Day: {{ previous_day }}</h2>
    <h2>Next Day: {{ next_day }}</h2>
</body>
</html>
